<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4D Rotation Platformer PoC</title>
<style>
  :root { --fg: #e6eef3; --muted: #93a7b5; --ana: #f06aa8; --kata: #4cc3e6; --gold: #ffd166; }
  html, body { height: 100%; margin: 0; background: #0d1a24; color: var(--fg); font: 14px/1.45 system-ui, "Segoe UI", sans-serif; overflow: hidden; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; }
  #hud > * { position: absolute; }
  .panel { background: rgba(8, 18, 26, 0.72); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 10px 14px; backdrop-filter: blur(4px); }
  #info { top: 14px; left: 14px; max-width: min(480px, calc(100vw - 28px)); display: flex; flex-direction: column; gap: 4px; }
  #level-title { font-weight: 600; letter-spacing: 0.02em; }
  #level-hint { color: var(--muted); font-size: 13px; }
  #mode { top: 14px; right: 14px; font-size: 12px; color: var(--muted); }
  #stats { bottom: 14px; right: 14px; font: 11px ui-monospace, monospace; color: var(--muted); }
  #axes { bottom: 18px; left: 50%; transform: translateX(-50%); font: 13px ui-monospace, monospace; letter-spacing: 0.04em; white-space: nowrap; color: var(--muted); }
  #axes b { color: var(--fg); font-weight: 600; }
  #overlay { inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(5, 12, 18, 0.55); }
  #overlay .panel { max-width: 540px; margin: 16px; display: flex; flex-direction: column; gap: 8px; text-align: center; }
  #overlay-title { font-size: 20px; font-weight: 600; }
  #overlay-text { color: var(--muted); }
  #overlay-text b { color: var(--fg); }
  #flash { top: 90px; left: 50%; transform: translateX(-50%); color: var(--gold); font-weight: 600; white-space: nowrap; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="hud">
  <div id="info" class="panel"><div id="level-title"></div><div id="level-hint"></div></div>
  <div id="mode" class="panel"></div>
  <div id="flash" class="panel" hidden></div>
  <div id="axes" class="panel"></div>
  <div id="stats"></div>
  <div id="overlay"><div class="panel"><div id="overlay-title"></div><div id="overlay-text"></div></div></div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
